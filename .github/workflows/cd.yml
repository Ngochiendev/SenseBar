name: CD (Release & DMG)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sensebar-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Build Signed DMG & Release
    runs-on: macos-26
    steps:
      - name: Select Xcode 26.2 (match local UI SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Verify UI build toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: $SDK_VERSION"
          if [[ "$SDK_VERSION" != "26.2" ]]; then
            echo "::error::Expected macOS SDK 26.2 to match the verified local popover rendering."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Đọc Version từ Info.plist & Xác định Tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          TAG="v${VERSION}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "▸ $TAG đã tồn tại; bỏ qua để giữ nguyên tag và tài sản phát hành."
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "▸ Target Version: $VERSION -> Tag: $TAG (Release: true)"

      - name: Prepare user-facing release notes
        if: steps.meta.outputs.should_release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/sensebar-release-python"
          "$RUNNER_TEMP/sensebar-release-python/bin/python" -m pip install 'PyYAML==6.0.3'
          "$RUNNER_TEMP/sensebar-release-python/bin/python" Tools/publish-updates.py --prepare-notes "$RELEASE_VERSION"
          echo "$RUNNER_TEMP/sensebar-release-python/bin" >> "$GITHUB_PATH"

      - name: Nhập chứng chỉ Apple Developer ID
        if: steps.meta.outputs.should_release == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'sensebar-temp-keychain' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          rm -f "$CERTIFICATE_PATH"

      - name: Validate Sparkle signing configuration
        if: steps.meta.outputs.should_release == 'true'
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SPARKLE_PUBLIC_KEY SPARKLE_PRIVATE_KEY SIGN_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository configuration: $name"
              exit 1
            fi
          done
          if [[ "$SIGN_IDENTITY" == '-' ]]; then
            echo "::error::SIGN_IDENTITY must be a Developer ID signing identity."
            exit 1
          fi

      - name: Build SenseBar Universal (arm64 + x86_64) & Signed DMG
        if: steps.meta.outputs.should_release == 'true'
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build-app.sh
          ./build-app.sh --dmg

      - name: Xóa Keychain tạm
        if: ${{ always() && steps.meta.outputs.should_release == 'true' }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/app-signing.keychain-db"

      - name: Chạy kiểm thử tự động (--selftest)
        if: steps.meta.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./build/SenseBar.app/Contents/MacOS/SenseBar --selftest
          lipo build/SenseBar.app/Contents/MacOS/SenseBar -verify_arch arm64 x86_64
          lipo build/SenseBar.app/Contents/Frameworks/libSenseBarNowPlaying.dylib -verify_arch arm64 x86_64

      - name: Đóng gói file phát hành (DMG, ZIP & SHA256)
        if: steps.meta.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          DMG_NAME="SenseBar-${TAG}-macOS-Universal.dmg"
          ZIP_NAME="SenseBar-${TAG}-macOS-Universal.zip"

          cp build/SenseBar.dmg "build/${DMG_NAME}"
          ditto -c -k --sequesterRsrc --keepParent build/SenseBar.app "build/${ZIP_NAME}"

          cd build
          shasum -a 256 "${DMG_NAME}" "${ZIP_NAME}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Sparkle update and retain two versions
        if: steps.meta.outputs.should_release == 'true'
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SPARKLE_PRIVATE_KEY SFTP_HOST SFTP_PORT SFTP_USER SFTP_REMOTE_DIR SFTP_PRIVATE_KEY SFTP_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          install -d -m 0700 "$HOME/.ssh"
          (umask 077; printf '%s\n' "$SFTP_PRIVATE_KEY" > "$HOME/.ssh/sensebar_deploy")
          (umask 077; printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts")
          trap 'rm -f "$HOME/.ssh/sensebar_deploy"' EXIT
          python3 Tools/publish-updates.py

      - name: Tự động gắn Tag ${{ steps.meta.outputs.tag }} & Phát hành GitHub Release
        if: steps.meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "SenseBar ${{ steps.meta.outputs.tag }}"
          body_path: build/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            build/SenseBar-${{ steps.meta.outputs.tag }}-macOS-Universal.dmg
            build/SenseBar-${{ steps.meta.outputs.tag }}-macOS-Universal.zip
            build/SHA256SUMS.txt
