name: CI (Build & Test)

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - dev

jobs:
  build-and-test:
    name: Build Universal & Run Selftest
    runs-on: macos-26
    steps:
      - name: Select Xcode 26.2 (match local UI SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Verify UI build toolchain
        shell: zsh {0}
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: $SDK_VERSION"
          if [[ "$SDK_VERSION" != "26.2" ]]; then
            echo "::error::Expected macOS SDK 26.2 to match the verified local popover rendering."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build SenseBar Universal (arm64 + x86_64)
        shell: zsh {0}
        run: |
          chmod +x build-app.sh
          ./build-app.sh

      - name: Chạy kiểm thử tự động (--selftest)
        shell: zsh {0}
        run: |
          ./build/SenseBar.app/Contents/MacOS/SenseBar --selftest

      - name: Kiểm tra Universal Binary (arm64 + x86_64)
        shell: zsh {0}
        run: |
          lipo -info build/SenseBar.app/Contents/MacOS/SenseBar
          lipo -info build/SenseBar.app/Contents/Frameworks/libSenseBarNowPlaying.dylib
