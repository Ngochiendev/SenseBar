# Changelog dành cho người dùng SenseBar, phiên bản mới đặt trước.
# type: feature (Tính năng mới), improvement (Cải thiện), fix (Sửa lỗi), other (Khác).
# version luôn là chuỗi "X.Y.Z"; date tùy chọn, dùng chuỗi "YYYY-MM-DD".
releases:
  # Đang chuẩn bị, chưa phát hành.
  - version: "1.3.5"
    changes:
      - type: feature
        text: "Thêm 7 thú cưng CrossPet, thay đổi biểu cảm khi nghe nhạc và tương tác."
      - type: improvement
        text: "Bảng chọn thú cưng gọn hơn, vị trí thú cưng trên tai thỏ và capsule cân đối hơn."
      - type: fix
        text: "Sửa hiện tượng giật khi di chuyển chuột giữa các màn hình ở chế độ Tất cả màn hình."
      - type: improvement
        text: "Giảm xử lý nền khi nghe nhạc, tìm ảnh bìa trên Zen và sử dụng nhiều màn hình."

  - version: "1.3.4"
    changes:
      - type: improvement
        text: "Hiển thị ảnh động minh họa Dynamic Island thực tế ngay trong bảng điều khiển."
      - type: fix
        text: "Khắc phục thanh sóng nhạc trên Dynamic Island bị tai thỏ che khuất khi mở rộng trên MacBook."

  - version: "1.3.3"
    changes:
      - type: improvement
        text: "Phát hiện bản cập nhật mới nhanh hơn khi khởi động ứng dụng, khi mở máy từ chế độ ngủ và theo chu kỳ mỗi giờ."
      - type: improvement
        text: "Hiển thị chấm báo hiệu trên biểu tượng Menu Bar và thẻ thông báo nổi bật ở đầu bảng điều khiển khi có bản cập nhật mới."

  - version: "1.3.2"
    changes:
      - type: other
        text: "Phát hành gói cài đặt v1.3.2 đồng bộ tài liệu và hình ảnh giới thiệu mới."

  - version: "1.3.1"
    changes:
      - type: improvement
        text: "Tinh chỉnh thông báo cập nhật, hỗ trợ giao diện sáng/tối."
      - type: improvement
        text: "Hiển thị rõ các cải tiến và lỗi đã sửa trong cửa sổ cập nhật."
      - type: fix
        text: "Sửa thông báo ‘Không thể kết nối’ xuất hiện dù kiểm tra cập nhật thành công."

  - version: "1.3.0"
    date: "2026-11-12"
    changes:
      - type: feature
        text: "Bổ sung cập nhật qua Sparkle: tải và cài phiên bản mới trực tiếp trong SenseBar."
      - type: feature
        text: "Hỗ trợ tự động kiểm tra cập nhật và kiểm tra theo yêu cầu trong Cài đặt."
